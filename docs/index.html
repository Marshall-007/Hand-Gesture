<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secret Number Battle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#ff007a;--cyan:#00e5ff;--green:#00ff88;--yellow:#ffe600;--bg1:#0a0a1a;--bg2:#1a1a3e;--bg3:#0f0f2d;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);--text:#e8e8f0}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));font-family:'Segoe UI',Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:12px;overflow-x:hidden}
.container{width:100%;max-width:500px;min-height:80vh;display:flex;flex-direction:column}

/* ── LOBBY ── */
.lobby-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;backdrop-filter:blur(8px)}
.lobby-card h1{font-size:26px;background:linear-gradient(135deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;letter-spacing:1px}
.lobby-card .sub{font-size:13px;opacity:.65;margin-bottom:24px}
.lobby-card label{display:block;text-align:left;font-size:12px;font-weight:700;opacity:.6;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.lobby-card input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);font-size:16px;background:rgba(255,255,255,0.08);color:#fff;outline:none;transition:border .2s}
.lobby-card input:focus{border-color:var(--pink)}
.lobby-card input::placeholder{color:rgba(255,255,255,0.3)}
.lobby-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{padding:14px 12px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;transition:transform .15s,opacity .2s;outline:none}
.btn:hover:not(:disabled){transform:scale(1.04)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--pink),#6c2cff);box-shadow:0 0 20px rgba(255,0,122,.3)}
.btn-secondary{background:linear-gradient(135deg,var(--cyan),#0072ff);box-shadow:0 0 20px rgba(0,229,255,.2)}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:10px}
.btn-green{background:linear-gradient(135deg,var(--green),#00b874)}
.btn-yellow{background:linear-gradient(135deg,var(--yellow),#ff9900);color:#111}
.btn-outline{background:transparent;border:1px solid var(--border);font-weight:600;font-size:13px}
.btn-outline:hover:not(:disabled){background:rgba(255,255,255,0.06)}
.lobby-status{margin-top:16px;font-size:13px;min-height:20px;line-height:1.4;opacity:.85}
.lobby-status.error{color:#ff4f6f}
.share-row{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center}
.share-row .link-text{font-size:11px;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cyan);flex:1;text-align:left}

/* ── GAME SCREEN ── */
.game-screen{display:flex;flex-direction:column;height:100%;flex:1}
.game-header{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;backdrop-filter:blur(8px)}
.game-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.game-title-row h2{font-size:14px;opacity:.6;font-weight:600;letter-spacing:.5px}
.room-badge{font-size:11px;background:rgba(255,255,255,0.1);padding:4px 10px;border-radius:8px;color:var(--cyan)}
.players-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.player-info{flex:1;text-align:center}
.player-info .p-label{font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.5px;opacity:.5}
.player-info .p-name{font-size:14px;font-weight:700;margin:2px 0}
.player-info .p-name.me{color:var(--cyan)}
.player-info .p-score{font-size:22px;font-weight:800}
.p1c{color:var(--pink)}
.p2c{color:var(--cyan)}
.vs-badge{font-size:13px;font-weight:800;opacity:.35}
.round-badge{text-align:center;font-size:11px;opacity:.5;margin-top:6px}
.my-secret{font-size:11px;text-align:center;margin-top:6px;opacity:.6}
.my-secret span{background:rgba(255,255,255,0.08);padding:3px 10px;border-radius:8px;font-weight:700;letter-spacing:1px;color:var(--yellow)}

/* ── LOG ── */
.game-log{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px;min-height:180px;max-height:50vh;scroll-behavior:smooth}
.log-entry{padding:8px 12px;margin-bottom:6px;border-radius:10px;font-size:13px;line-height:1.5;border-left:3px solid transparent;background:rgba(255,255,255,0.03)}
.log-entry.system{border-left-color:rgba(255,255,255,0.15);font-style:italic;opacity:.65;font-size:12px}
.log-entry.question{border-left-color:var(--cyan);background:rgba(0,229,255,0.06)}
.log-entry.answer{border-left-color:var(--green);background:rgba(0,255,136,0.06)}
.log-entry.guess-wrong{border-left-color:var(--pink);background:rgba(255,0,122,0.06)}
.log-entry.guess-correct{border-left-color:var(--yellow);background:rgba(255,230,0,0.1);font-weight:700}
.log-entry.round-divider{text-align:center;font-weight:800;font-size:14px;border-left-color:transparent;background:rgba(255,255,255,0.04);color:var(--yellow);letter-spacing:1px;padding:10px}
.log-entry.winner-banner{text-align:center;font-weight:800;font-size:16px;padding:14px;border-left-color:transparent;background:linear-gradient(135deg,rgba(255,0,122,0.15),rgba(0,229,255,0.15));border-radius:12px;margin:8px 0}

/* ── ACTION PANEL ── */
.action-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.action-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.6;margin-bottom:8px}
.action-row{display:flex;gap:8px;align-items:center}
.action-row input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,0.08);color:#fff;font-size:16px;outline:none}
.action-row input:focus{border-color:var(--pink)}
.action-row input::placeholder{color:rgba(255,255,255,0.3)}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.answer-btns{display:flex;gap:10px;justify-content:center;margin-top:4px}
.answer-btns .btn{min-width:100px;font-size:16px}
.pending-q{text-align:center;font-size:15px;padding:10px;margin-bottom:8px;background:rgba(0,229,255,0.08);border-radius:10px;line-height:1.5}
.pending-q em{color:var(--cyan);font-style:normal;font-weight:700}
.waiting-msg{text-align:center;padding:10px;font-size:14px;opacity:.7}
.waiting-msg .dot-pulse{display:inline-block;animation:pulse-dot 1.4s infinite}
@keyframes pulse-dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
.play-again-wrap{text-align:center;padding:6px 0}

.hidden{display:none!important}

/* Scrollbar */
.game-log::-webkit-scrollbar{width:5px}
.game-log::-webkit-scrollbar-track{background:transparent}
.game-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}

@media(max-width:500px){
  .lobby-card{padding:24px 16px}
  .lobby-card h1{font-size:22px}
  .game-header{padding:12px}
  .action-panel{padding:12px}
  .players-row{gap:4px}
}
</style>
</head>
<body>

<!-- ════════ LOBBY ════════ -->
<div class="container" id="lobbyContainer">
<div class="lobby-card">
  <h1>⚔️ SECRET NUMBER BATTLE</h1>
  <p class="sub">Guess each other's secret number — play from anywhere!</p>

  <label for="nameInput">Your Name</label>
  <input id="nameInput" type="text" placeholder="Enter your name" maxlength="20" autocomplete="off"/>

  <label for="roomInput">Room Code</label>
  <input id="roomInput" type="text" placeholder="e.g. battle7" maxlength="24" autocomplete="off"/>

  <div class="lobby-btns">
    <button class="btn btn-primary" id="hostBtn">Create Room (P1)</button>
    <button class="btn btn-secondary" id="joinBtn">Join Room (P2)</button>
  </div>

  <div id="shareRow" class="share-row hidden">
    <span class="link-text" id="shareLink"></span>
    <button class="btn btn-outline btn-sm" id="copyBtn">📋 Copy</button>
  </div>

  <p class="lobby-status" id="lobbyStatus"></p>
</div>
</div>

<!-- ════════ GAME ════════ -->
<div class="container hidden" id="gameContainer">
<div class="game-screen">

  <div class="game-header">
    <div class="game-title-row">
      <h2>⚔️ SECRET NUMBER BATTLE</h2>
      <span class="room-badge" id="gRoomBadge"></span>
    </div>
    <div class="players-row">
      <div class="player-info">
        <div class="p-label p1c">Player 1</div>
        <div class="p-name" id="gP1Name">—</div>
        <div class="p-score p1c" id="gP1Score">0</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="player-info">
        <div class="p-label p2c">Player 2</div>
        <div class="p-name" id="gP2Name">—</div>
        <div class="p-score p2c" id="gP2Score">0</div>
      </div>
    </div>
    <div class="round-badge" id="gRoundBadge">Round 1</div>
    <div class="my-secret hidden" id="mySecretDisplay">Your secret: <span id="mySecretNum">—</span></div>
  </div>

  <div class="game-log" id="gameLog"></div>

  <div class="action-panel" id="actionPanel"></div>

</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";

/* ── DOM refs ── */
const $=id=>document.getElementById(id);
const lobbyContainer=$('lobbyContainer'), gameContainer=$('gameContainer');
const nameInput=$('nameInput'), roomInput=$('roomInput');
const hostBtn=$('hostBtn'), joinBtn=$('joinBtn');
const lobbyStatus=$('lobbyStatus'), shareRow=$('shareRow'), shareLink=$('shareLink'), copyBtn=$('copyBtn');
const gRoomBadge=$('gRoomBadge'), gP1Name=$('gP1Name'), gP2Name=$('gP2Name');
const gP1Score=$('gP1Score'), gP2Score=$('gP2Score'), gRoundBadge=$('gRoundBadge');
const mySecretDisplay=$('mySecretDisplay'), mySecretNum=$('mySecretNum');
const gameLog=$('gameLog'), actionPanel=$('actionPanel');

/* ── State ── */
let peer=null, conn=null;
let isHost=false, myPlayer=0; // 1 or 2
let myName='', roomCode='';
let myLocalSecret=null;       // only stored locally, never synced until round over

// Canonical game state (host authoritative)
let G={
  phase:'lobby', // lobby | picking | playing | answering | roundOver
  round:1,
  currentTurn:1,
  p1Name:'Player 1', p2Name:'Player 2',
  p1Picked:false, p2Picked:false,
  p1Secret:null, p2Secret:null,     // host stores both; only revealed in roundOver
  scores:{p1:0, p2:0},
  log:[],         // {text, cls}
  pendingQuestion:null, // {from:1|2, text}
  roundWinner:null,     // null|1|2
  revealedNumbers:null, // null|{p1,p2}
  totalRounds:0
};

/* ── Helpers ── */
function sanitizeRoom(v){return String(v||'').toLowerCase().replace(/[^a-z0-9\-]/g,'').slice(0,24)}
function sanitizeName(v){return String(v||'').trim().slice(0,20)}
function peerId(code){return 'snb-'+code}
function statusMsg(txt,err){lobbyStatus.textContent=txt;lobbyStatus.classList.toggle('error',!!err)}
function show(el){el.classList.remove('hidden')}
function hide(el){el.classList.add('hidden')}

function saveScores(){
  try{localStorage.setItem('snb-scores-'+roomCode,JSON.stringify(G.scores))}catch(e){}
}
function loadScores(){
  try{
    const s=JSON.parse(localStorage.getItem('snb-scores-'+roomCode));
    if(s&&typeof s.p1==='number'){G.scores=s}
  }catch(e){}
}

/* ── Prefill room from URL ── */
const urlParams=new URLSearchParams(location.search);
const urlRoom=sanitizeRoom(urlParams.get('room'));
if(urlRoom) roomInput.value=urlRoom;

/* ── Lobby actions ── */
hostBtn.onclick=()=>{
  const name=sanitizeName(nameInput.value);
  const room=sanitizeRoom(roomInput.value);
  if(!name){statusMsg('Please enter your name.',true);return}
  if(!room){statusMsg('Please enter a room code.',true);return}
  myName=name; roomCode=room; isHost=true; myPlayer=1;
  hostBtn.disabled=joinBtn.disabled=true;
  statusMsg('Creating room...');
  initPeerHost();
};

joinBtn.onclick=()=>{
  const name=sanitizeName(nameInput.value);
  const room=sanitizeRoom(roomInput.value);
  if(!name){statusMsg('Please enter your name.',true);return}
  if(!room){statusMsg('Please enter a room code.',true);return}
  myName=name; roomCode=room; isHost=false; myPlayer=2;
  hostBtn.disabled=joinBtn.disabled=true;
  statusMsg('Joining room...');
  initPeerJoin();
};

copyBtn.onclick=()=>{
  const url=location.origin+location.pathname+'?room='+roomCode;
  navigator.clipboard.writeText(url).then(()=>{copyBtn.textContent='✅ Copied!'
    setTimeout(()=>{copyBtn.textContent='📋 Copy'},2000)
  }).catch(()=>{});
};

/* ── PeerJS Host ── */
function initPeerHost(){
  if(peer){peer.destroy();peer=null}
  peer=new Peer(peerId(roomCode));
  peer.on('open',()=>{
    statusMsg('Room "'+roomCode+'" created! Share the link for Player 2 to join.');
    const url=location.origin+location.pathname+'?room='+roomCode;
    shareLink.textContent=url;
    show(shareRow);
    const u=new URL(location.href);u.searchParams.set('room',roomCode);
    history.replaceState({},'',u.toString());
  });
  peer.on('connection',connection=>{
    conn=connection;
    setupHostConn();
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){statusMsg('Room code "'+roomCode+'" is already in use. Try another.',true)}
    else{statusMsg('Host error: '+err.type,true)}
    hostBtn.disabled=joinBtn.disabled=false;
  });
}

function setupHostConn(){
  conn.on('open',()=>{
    statusMsg('Player 2 connected!');
  });
  conn.on('data',msg=>{
    handleHostMessage(msg);
  });
  conn.on('close',()=>{
    statusMsg('Player 2 disconnected.',true);
  });
}

/* ── PeerJS Join ── */
let joinAttempts=0, joinTimer=null;
function initPeerJoin(){
  if(peer){peer.destroy();peer=null}
  joinAttempts=0;
  peer=new Peer();
  peer.on('open',()=>{
    attemptJoin();
  });
  peer.on('error',err=>{
    if(err.type==='peer-unavailable'){
      scheduleJoinRetry();
    }else{
      statusMsg('Join error: '+err.type,true);
      hostBtn.disabled=joinBtn.disabled=false;
    }
  });
}

function attemptJoin(){
  statusMsg('Connecting to room "'+roomCode+'"...');
  conn=peer.connect(peerId(roomCode),{reliable:true});
  conn.on('open',()=>{
    if(joinTimer){clearTimeout(joinTimer);joinTimer=null}
    conn.send({type:'join',name:myName});
    statusMsg('Connected! Waiting for host...');
  });
  conn.on('data',msg=>{
    handleP2Message(msg);
  });
  conn.on('close',()=>{
    statusMsg('Disconnected from host.',true);
  });
  conn.on('error',err=>{
    if(err.type==='peer-unavailable') scheduleJoinRetry();
  });
}

function scheduleJoinRetry(){
  joinAttempts++;
  if(joinAttempts>=10){
    statusMsg('Could not find room "'+roomCode+'". Make sure P1 created it first.',true);
    hostBtn.disabled=joinBtn.disabled=false;
    return;
  }
  statusMsg('Waiting for host... attempt '+joinAttempts+'/10');
  joinTimer=setTimeout(()=>{
    joinTimer=null;
    // destroy old conn attempt
    conn=null;
    attemptJoin();
  },1500);
}

/* ── HOST: message handler ── */
function handleHostMessage(msg){
  if(!msg||!msg.type)return;
  switch(msg.type){
    case 'join':
      G.p2Name=sanitizeName(msg.name)||'Player 2';
      G.p1Name=myName;
      loadScores();
      startPickingPhase();
      conn.send({type:'welcome',hostName:myName,room:roomCode});
      enterGame();
      broadcastSync();
      break;
    case 'pick':
      if(G.phase!=='picking')return;
      const n=Number(msg.number);
      if(!n||n<1||n>150)return;
      G.p2Secret=n; G.p2Picked=true;
      addLog('✅ '+G.p2Name+' locked in their number.','system');
      if(G.p1Picked&&G.p2Picked) startPlayingPhase();
      broadcastSync();
      break;
    case 'ask':
      if(G.phase!=='playing'||G.currentTurn!==2)return;
      const q=String(msg.question||'').trim().slice(0,200);
      if(!q)return;
      G.pendingQuestion={from:2,text:q};
      G.phase='answering';
      addLog('🔵 '+G.p2Name+' asks: "'+q+'"','question');
      broadcastSync();
      break;
    case 'answer':
      if(G.phase!=='answering'||!G.pendingQuestion||G.pendingQuestion.from!==1)return;
      const ans=!!msg.value;
      addLog('🟢 '+G.p2Name+' answers: '+(ans?'Yes ✓':'No ✗'),'answer');
      G.pendingQuestion=null;
      G.phase='playing';
      G.currentTurn=2; // back to the asker's opponent? No — after answering, turn passes to answerer
      // Turn logic: the asker was P1 (pendingQuestion.from===1 means P2 asked and P1 must answer... wait, let me re-check)
      // pendingQuestion.from = who ASKED. If from===1, P1 asked, P2 answers. After P2 answers, turn goes to P2.
      G.currentTurn=2;
      broadcastSync();
      break;
    case 'guess':
      if(G.phase!=='playing'||G.currentTurn!==2)return;
      const g=Number(msg.number);
      if(!g||g<1||g>150)return;
      processGuess(2,g);
      broadcastSync();
      break;
    case 'playAgain':
      nextRound();
      broadcastSync();
      break;
  }
}

/* ── P2: message handler ── */
function handleP2Message(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='welcome'){
    myName=sanitizeName(nameInput.value);
    roomCode=msg.room;
    enterGame();
  }
  if(msg.type==='sync'){
    // Apply state but don't overwrite our local secret with null
    const incoming=msg.state;
    // Preserve local secret
    const savedSecret=myLocalSecret;
    Object.assign(G,incoming);
    myLocalSecret=savedSecret;
    // If round over, secret is revealed in state
    renderGame();
  }
}

/* ── Game logic (host only) ── */
function startPickingPhase(){
  G.phase='picking'; G.p1Picked=false; G.p2Picked=false;
  G.p1Secret=null; G.p2Secret=null;
  G.pendingQuestion=null; G.roundWinner=null; G.revealedNumbers=null;
  addLog('── Round '+G.round+' ──','round-divider');
  addLog('Both players: secretly pick a number between 1 and 150.','system');
}

function startPlayingPhase(){
  G.phase='playing'; G.currentTurn=1;
  addLog('Both numbers locked! '+G.p1Name+' goes first.','system');
}

function processGuess(player,guess){
  const targetSecret=player===1?G.p2Secret:G.p1Secret;
  const guesserName=player===1?G.p1Name:G.p2Name;
  if(guess===targetSecret){
    addLog('🎯 '+guesserName+' guesses '+guess+' — CORRECT! 🎉','guess-correct');
    G.roundWinner=player;
    G.revealedNumbers={p1:G.p1Secret,p2:G.p2Secret};
    if(player===1) G.scores.p1++; else G.scores.p2++;
    G.totalRounds++;
    G.phase='roundOver';
    addLog('🏆 '+guesserName+' wins Round '+G.round+'!','winner-banner');
    addLog('Secrets: '+G.p1Name+'='+G.p1Secret+', '+G.p2Name+'='+G.p2Secret,'system');
    saveScores();
  }else if(guess<targetSecret){
    addLog('❌ '+guesserName+' guesses '+guess+' — Too Low ↑','guess-wrong');
    G.currentTurn=player===1?2:1;
  }else{
    addLog('❌ '+guesserName+' guesses '+guess+' — Too High ↓','guess-wrong');
    G.currentTurn=player===1?2:1;
  }
}

function nextRound(){
  G.round++;
  startPickingPhase();
  if(isHost) myLocalSecret=null;
}

function addLog(text,cls){
  G.log.push({text,cls});
}

function broadcastSync(){
  renderGame();
  if(conn&&conn.open){
    // Send state to P2 but strip P1's secret during play (P2 already knows their own)
    const toSend=JSON.parse(JSON.stringify(G));
    if(G.phase!=='roundOver'){
      toSend.p1Secret=null;
      // Also don't reveal P2's secret back (P2 knows it locally)
      // Actually host stores p2Secret. We should not send it back as plaintext either.
      toSend.p2Secret=null;
    }
    conn.send({type:'sync',state:toSend});
  }
}

/* ── Enter game screen ── */
function enterGame(){
  hide(lobbyContainer); show(gameContainer);
  renderGame();
}

/* ── Render ── */
function renderGame(){
  // Header
  gRoomBadge.textContent='🔗 '+roomCode;
  gP1Name.textContent=G.p1Name;
  gP2Name.textContent=G.p2Name;
  gP1Name.classList.toggle('me',myPlayer===1);
  gP2Name.classList.toggle('me',myPlayer===2);
  gP1Score.textContent=G.scores.p1;
  gP2Score.textContent=G.scores.p2;
  gRoundBadge.textContent='Round '+G.round+(G.totalRounds?' · '+G.totalRounds+' played':'');

  // My secret badge
  if(myLocalSecret&&G.phase!=='roundOver'){
    show(mySecretDisplay); mySecretNum.textContent=myLocalSecret;
  }else if(G.phase==='roundOver'&&G.revealedNumbers){
    show(mySecretDisplay);
    mySecretNum.textContent=myPlayer===1?G.revealedNumbers.p1:G.revealedNumbers.p2;
  }else{
    hide(mySecretDisplay);
  }

  // Log
  gameLog.innerHTML='';
  G.log.forEach(entry=>{
    const div=document.createElement('div');
    div.className='log-entry '+(entry.cls||'');
    div.textContent=entry.text;
    gameLog.appendChild(div);
  });
  gameLog.scrollTop=gameLog.scrollHeight;

  // Action panel
  renderActionPanel();
}

function renderActionPanel(){
  actionPanel.innerHTML='';
  const me=myPlayer;
  const opponentName=me===1?G.p2Name:G.p1Name;

  if(G.phase==='picking'){
    const picked=me===1?G.p1Picked:G.p2Picked;
    if(picked){
      actionPanel.innerHTML='<div class="waiting-msg">Waiting for opponent to pick their number<span class="dot-pulse">...</span></div>';
    }else{
      const label=document.createElement('div');label.className='action-label';label.textContent='Pick your secret number (1-150)';
      const row=document.createElement('div');row.className='action-row';
      const inp=document.createElement('input');inp.type='password';inp.inputMode='numeric';inp.placeholder='Your secret number';inp.id='pickInput';inp.min='1';inp.max='150';
      const btn=document.createElement('button');btn.className='btn btn-primary';btn.textContent='Lock In 🔒';
      btn.onclick=()=>handlePick(inp);
      inp.onkeydown=e=>{if(e.key==='Enter')handlePick(inp)};
      row.appendChild(inp);row.appendChild(btn);
      actionPanel.appendChild(label);actionPanel.appendChild(row);
      setTimeout(()=>inp.focus(),50);
    }
    return;
  }

  if(G.phase==='answering'){
    const q=G.pendingQuestion;
    if(!q)return;
    // The person who must answer is the opponent of the asker
    const mustAnswer=q.from===1?2:1;
    if(me===mustAnswer){
      const wrap=document.createElement('div');
      wrap.innerHTML='<div class="pending-q"><em>'+(q.from===1?G.p1Name:G.p2Name)+'</em> asks:<br>"'+escHtml(q.text)+'"</div>';
      const label=document.createElement('div');label.className='action-label';label.textContent='Your answer:';
      const btns=document.createElement('div');btns.className='answer-btns';
      const yBtn=document.createElement('button');yBtn.className='btn btn-green';yBtn.textContent='👍 Yes';
      const nBtn=document.createElement('button');nBtn.className='btn btn-primary';nBtn.textContent='👎 No';
      yBtn.onclick=()=>handleAnswer(true);
      nBtn.onclick=()=>handleAnswer(false);
      btns.appendChild(yBtn);btns.appendChild(nBtn);
      actionPanel.appendChild(wrap);actionPanel.appendChild(label);actionPanel.appendChild(btns);
    }else{
      actionPanel.innerHTML='<div class="waiting-msg">Waiting for '+opponentName+' to answer<span class="dot-pulse">...</span></div>';
    }
    return;
  }

  if(G.phase==='playing'){
    if(G.currentTurn!==me){
      actionPanel.innerHTML='<div class="waiting-msg">Waiting for '+(G.currentTurn===1?G.p1Name:G.p2Name)+'<span class="dot-pulse">...</span></div>';
      return;
    }
    // My turn — show mode buttons
    const label=document.createElement('div');label.className='action-label';label.textContent='Your turn — choose an action:';
    const mbtns=document.createElement('div');mbtns.className='mode-btns';
    const askBtn=document.createElement('button');askBtn.className='btn btn-secondary';askBtn.textContent='❓ Ask Question';
    const guessBtn=document.createElement('button');guessBtn.className='btn btn-primary';guessBtn.textContent='🎯 Guess Number';
    askBtn.onclick=()=>showAskUI();
    guessBtn.onclick=()=>showGuessUI();
    mbtns.appendChild(askBtn);mbtns.appendChild(guessBtn);
    actionPanel.appendChild(label);actionPanel.appendChild(mbtns);
    return;
  }

  if(G.phase==='roundOver'){
    const wrap=document.createElement('div');wrap.className='play-again-wrap';
    const btn=document.createElement('button');btn.className='btn btn-yellow';btn.textContent='🔄 Play Again';
    btn.onclick=()=>handlePlayAgain();
    wrap.appendChild(btn);
    actionPanel.appendChild(wrap);
    return;
  }

  // Lobby fallback
  actionPanel.innerHTML='<div class="waiting-msg">Waiting for game to start<span class="dot-pulse">...</span></div>';
}

function showAskUI(){
  actionPanel.innerHTML='';
  const label=document.createElement('div');label.className='action-label';label.textContent='Ask a yes/no question:';
  const row=document.createElement('div');row.className='action-row';
  const inp=document.createElement('input');inp.type='text';inp.placeholder='e.g. Is it more than 50?';inp.id='askInput';inp.maxLength=200;
  const btn=document.createElement('button');btn.className='btn btn-secondary';btn.textContent='Send';
  const back=document.createElement('button');back.className='btn btn-outline btn-sm';back.textContent='← Back';back.style.marginTop='8px';
  btn.onclick=()=>handleAsk(inp);
  inp.onkeydown=e=>{if(e.key==='Enter')handleAsk(inp)};
  back.onclick=()=>renderActionPanel();
  row.appendChild(inp);row.appendChild(btn);
  actionPanel.appendChild(label);actionPanel.appendChild(row);actionPanel.appendChild(back);
  setTimeout(()=>inp.focus(),50);
}

function showGuessUI(){
  actionPanel.innerHTML='';
  const label=document.createElement('div');label.className='action-label';label.textContent='Guess their secret number (1-150):';
  const row=document.createElement('div');row.className='action-row';
  const inp=document.createElement('input');inp.type='number';inp.min='1';inp.max='150';inp.placeholder='Your guess';inp.id='guessInput';inp.inputMode='numeric';
  const btn=document.createElement('button');btn.className='btn btn-primary';btn.textContent='Guess!';
  const back=document.createElement('button');back.className='btn btn-outline btn-sm';back.textContent='← Back';back.style.marginTop='8px';
  btn.onclick=()=>handleGuess(inp);
  inp.onkeydown=e=>{if(e.key==='Enter')handleGuess(inp)};
  back.onclick=()=>renderActionPanel();
  row.appendChild(inp);row.appendChild(btn);
  actionPanel.appendChild(label);actionPanel.appendChild(row);actionPanel.appendChild(back);
  setTimeout(()=>inp.focus(),50);
}

/* ── Action handlers ── */
function handlePick(inp){
  const v=Number(inp.value);
  if(!v||v<1||v>150){inp.style.borderColor='#ff4f6f';return}
  myLocalSecret=v;
  if(isHost){
    G.p1Secret=v; G.p1Picked=true;
    addLog('✅ '+G.p1Name+' locked in their number.','system');
    if(G.p1Picked&&G.p2Picked) startPlayingPhase();
    broadcastSync();
  }else{
    conn.send({type:'pick',number:v});
    // Optimistic UI: show waiting
    renderGame();
  }
}

function handleAsk(inp){
  const q=String(inp.value||'').trim();
  if(!q){inp.style.borderColor='#ff4f6f';return}
  if(isHost){
    G.pendingQuestion={from:1,text:q};
    G.phase='answering';
    addLog('🔵 '+G.p1Name+' asks: "'+q+'"','question');
    broadcastSync();
  }else{
    conn.send({type:'ask',question:q});
  }
}

function handleAnswer(val){
  if(isHost){
    // Host is answering (which means P2 asked → pendingQuestion.from===2)
    const ans=!!val;
    addLog('🟢 '+G.p1Name+' answers: '+(ans?'Yes ✓':'No ✗'),'answer');
    G.pendingQuestion=null;
    G.phase='playing';
    // After P1 answers P2's question, turn goes to P1
    G.currentTurn=1;
    broadcastSync();
  }else{
    conn.send({type:'answer',value:val});
  }
}

function handleGuess(inp){
  const v=Number(inp.value);
  if(!v||v<1||v>150){inp.style.borderColor='#ff4f6f';return}
  if(isHost){
    processGuess(1,v);
    broadcastSync();
  }else{
    conn.send({type:'guess',number:v});
  }
}

function handlePlayAgain(){
  if(isHost){
    nextRound();
    myLocalSecret=null;
    broadcastSync();
  }else{
    myLocalSecret=null;
    conn.send({type:'playAgain'});
  }
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

})();
</script>
