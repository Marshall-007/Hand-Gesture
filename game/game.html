<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Player Secret Number Battle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #ff3cac, #221b4d 45%, #050510);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow-x: hidden;
      padding: 12px;
    }

    .game-wrap {
      width: min(95vw, 460px);
      text-align: center;
      padding: 16px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 460 / 520;
      height: auto;
      display: block;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 35px rgba(255, 60, 172, 0.5);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      width: 170px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      text-align: center;
      outline: none;
      background: white;
      color: #111;
      font-weight: bold;
    }

    button {
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #ff007a, #6c2cff);
      box-shadow: 0 0 18px rgba(255, 0, 122, 0.45);
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .small-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .hint {
      margin-top: 12px;
      opacity: 0.8;
      font-size: 14px;
      line-height: 1.4;
    }

    .online-controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .online-controls input {
      width: 100%;
      grid-column: span 2;
      font-size: 15px;
      padding: 10px;
    }

    .online-status {
      grid-column: span 2;
      font-size: 12px;
      opacity: 0.85;
      text-align: left;
      min-height: 16px;
      padding: 2px 2px 0;
    }

    @media (max-width: 600px) {
      .game-wrap {
        width: min(96vw, 460px);
        padding: 10px;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      input,
      button {
        width: 100%;
      }

      input {
        font-size: 16px;
      }

      .hint {
        font-size: 13px;
      }

      .online-controls {
        grid-template-columns: 1fr;
      }

      .online-controls input,
      .online-status {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <div class="game-wrap">
    <canvas id="gameCanvas" width="460" height="520"></canvas>

    <div class="controls">
      <input id="numberInput" type="password" inputmode="numeric" placeholder="1 - 150" />
      <button id="mainButton">Lock P1 Number</button>
      <button id="resetButton" class="small-btn">Reset</button>
    </div>

    <div class="online-controls">
      <input id="roomCodeInput" type="text" placeholder="Room code (example: battle7)" maxlength="24" />
      <button id="hostButton">Host As P1</button>
      <button id="joinButton" class="small-btn">Join As P2</button>
      <p id="onlineStatus" class="online-status">Online mode: both players can use this same page URL.</p>
    </div>

    <p class="hint">
      Both players secretly lock in a number. Then take turns guessing each other’s number.
    </p>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const input = document.getElementById("numberInput");
    const mainButton = document.getElementById("mainButton");
    const resetButton = document.getElementById("resetButton");
    const roomCodeInput = document.getElementById("roomCodeInput");
    const hostButton = document.getElementById("hostButton");
    const joinButton = document.getElementById("joinButton");
    const onlineStatus = document.getElementById("onlineStatus");

    let p1Secret = null;
    let p2Secret = null;

    let phase = "p1_set";
    let currentPlayer = 1;

    let p1Attempts = 0;
    let p2Attempts = 0;

    let p1WrongGuesses = new Set();
    let p2WrongGuesses = new Set();

    let p1Wins = 0;
    let p2Wins = 0;
    let ties = 0;

    let p1Solved = false;
    let p2Solved = false;

    let message = "Player 1";
    let subMessage = "Secretly choose your number";
    let footerMessage = "Player 2, look away 👀";

    let particles = [];
    let pulse = 0;
    let shake = 0;

    let onlineMode = false;
    let isHost = false;
    let myPlayer = 1;
    let peer = null;
    let conn = null;
    let roomCode = "";
    let hostReady = false;
    let joinRetryTimer = null;
    let joinAttempts = 0;

    const BASE_WIDTH = 460;
    const BASE_HEIGHT = 520;
    const DEFAULT_ROOM_CODE = "hand-gesture-live";

    mainButton.addEventListener("click", handleAction);
    resetButton.addEventListener("click", handleResetAction);
    hostButton.addEventListener("click", hostRoom);
    joinButton.addEventListener("click", joinRoom);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        handleAction();
      }
    });

    window.addEventListener("resize", resizeCanvas);

    function resizeCanvas() {
      canvas.width = BASE_WIDTH;
      canvas.height = BASE_HEIGHT;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function sanitizeRoomCode(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, "")
        .slice(0, 24);
    }

    function getDesiredRoomCode() {
      return sanitizeRoomCode(roomCodeInput.value) || DEFAULT_ROOM_CODE;
    }

    function setOnlineStatus(text) {
      onlineStatus.textContent = text;
    }

    function setRoomInUrl(code) {
      const url = new URL(window.location.href);
      url.searchParams.set("room", code);
      window.history.replaceState({}, "", url.toString());
    }

    function canPlayerAct(player) {
      if (phase === "p1_set") {
        return player === 1;
      }

      if (phase === "p2_set") {
        return player === 2;
      }

      if (phase === "guessing") {
        return player === currentPlayer;
      }

      return true;
    }

    function canLocalUserAct() {
      // Block all game interaction until the player has hosted or joined
      if (!onlineMode) {
        return false;
      }

      if (isHost && !hostReady) {
        return false;
      }

      return canPlayerAct(myPlayer);
    }

    function updateInputAvailability() {
      const canAct = canLocalUserAct();
      input.disabled = !canAct;
      mainButton.disabled = !canAct;

      if (isHost && !hostReady) {
        setOnlineStatus(`Opening host room ${roomCode || getDesiredRoomCode()}...`);
        return;
      }

      if (!onlineMode) {
        setOnlineStatus(`Host this room as P1 or join as P2 to start playing.`);
        return;
      }

      if (canAct) {
        setOnlineStatus(`Online room ${roomCode}: your turn (P${myPlayer}).`);
      } else {
        setOnlineStatus(`Online room ${roomCode}: waiting for P${currentPlayer}.`);
      }
    }

    function resetPeerState() {
      if (joinRetryTimer) {
        clearTimeout(joinRetryTimer);
        joinRetryTimer = null;
      }

      joinAttempts = 0;
      hostReady = false;

      if (conn) {
        conn = null;
      }

      if (peer) {
        peer.destroy();
        peer = null;
      }
    }

    function getStateSnapshot() {
      return {
        p1Secret,
        p2Secret,
        phase,
        currentPlayer,
        p1Attempts,
        p2Attempts,
        p1WrongGuesses: Array.from(p1WrongGuesses),
        p2WrongGuesses: Array.from(p2WrongGuesses),
        p1Wins,
        p2Wins,
        ties,
        p1Solved,
        p2Solved,
        message,
        subMessage,
        footerMessage,
        inputType: input.type,
        inputPlaceholder: input.placeholder,
        mainButtonText: mainButton.textContent
      };
    }

    function applyStateSnapshot(state) {
      p1Secret = state.p1Secret;
      p2Secret = state.p2Secret;
      phase = state.phase;
      currentPlayer = state.currentPlayer;
      p1Attempts = state.p1Attempts;
      p2Attempts = state.p2Attempts;
      p1WrongGuesses = new Set(state.p1WrongGuesses || []);
      p2WrongGuesses = new Set(state.p2WrongGuesses || []);
      p1Wins = state.p1Wins;
      p2Wins = state.p2Wins;
      ties = state.ties;
      p1Solved = state.p1Solved;
      p2Solved = state.p2Solved;
      message = state.message;
      subMessage = state.subMessage;
      footerMessage = state.footerMessage;
      input.type = state.inputType || "number";
      input.placeholder = state.inputPlaceholder || "Your guess";
      input.min = (state.inputType === "number") ? "1" : "";
      input.max = (state.inputType === "number") ? "150" : "";
      mainButton.textContent = state.mainButtonText || "Guess";
      // Only clear input if the player hasn't started typing something
      if (!input.value || !canLocalUserAct()) {
        input.value = "";
      }
      updateInputAvailability();
    }

    function broadcastState() {
      if (onlineMode && isHost && conn && conn.open) {
        conn.send({ type: "state", payload: getStateSnapshot() });
      }
      updateInputAvailability();
    }

    function attachConnHandlers(connection) {
      conn = connection;

      conn.on("data", data => {
        if (isHost) {
          if (data.type === "action") {
            handleAction(data.value, true);
          }

          if (data.type === "reset") {
            resetGame();
            broadcastState();
          }

          return;
        }

        if (data.type === "state") {
          applyStateSnapshot(data.payload);
        }
      });

      conn.on("open", () => {
        onlineMode = true;
        setOnlineStatus(`Connected in room ${roomCode}. You are P${myPlayer}.`);
        updateInputAvailability();
        if (isHost) {
          broadcastState();
        }
      });

      conn.on("close", () => {
        if (conn !== connection) {
          return;
        }

        setOnlineStatus("Connection closed. You can host/join again.");
        onlineMode = false;
        conn = null;
        updateInputAvailability();
      });

      conn.on("error", err => {
        if (!isHost && err && err.type === "peer-unavailable") {
          scheduleJoinRetry();
          return;
        }

        setOnlineStatus(`Connection error in room ${roomCode}. Retry host/join.`);
      });
    }

    function scheduleJoinRetry() {
      if (joinAttempts >= 8) {
        setOnlineStatus(`Join failed for room ${roomCode}. Make sure P1 tapped Host As P1 and keeps the page open.`);
        return;
      }

      if (joinRetryTimer) {
        clearTimeout(joinRetryTimer);
      }

      joinAttempts += 1;
      setOnlineStatus(`Waiting for P1 in room ${roomCode}... retry ${joinAttempts}/8`);
      joinRetryTimer = setTimeout(() => {
        joinRetryTimer = null;
        attemptJoinConnection();
      }, 1200);
    }

    function attemptJoinConnection() {
      if (!peer || !peer.open) {
        return;
      }

      const connection = peer.connect(`secret-battle-${roomCode}`, { reliable: true });
      attachConnHandlers(connection);
      setOnlineStatus(`Joining room ${roomCode} as P2...`);
    }

    function hostRoom() {
      const code = getDesiredRoomCode();
      roomCodeInput.value = code;
      roomCode = code;
      myPlayer = 1;
      isHost = true;

      resetPeerState();
      updateInputAvailability();

      peer = new Peer(`secret-battle-${code}`);

      peer.on("open", () => {
        hostReady = true;
        onlineMode = true;
        setRoomInUrl(code);
        setOnlineStatus(`Hosting room ${code} as P1. Player 2 can open this same page and tap Join As P2.`);
        updateInputAvailability();
      });

      peer.on("connection", connection => {
        attachConnHandlers(connection);
      });

      peer.on("error", err => {
        hostReady = false;
        setOnlineStatus(`Host error: ${err.type || "connection failed"}. Try Host As P1 again.`);
      });
    }

    function joinRoom() {
      const code = getDesiredRoomCode();

      roomCode = code;
      roomCodeInput.value = code;
      myPlayer = 2;
      isHost = false;

      resetPeerState();

      peer = new Peer();

      peer.on("open", () => {
        onlineMode = true;
        attemptJoinConnection();
      });

      peer.on("error", err => {
        if (err && err.type === "peer-unavailable") {
          scheduleJoinRetry();
          return;
        }

        setOnlineStatus(`Join error: ${err.type || "room unavailable"}.`);
      });
    }

    function resetGame() {
      p1Secret = null;
      p2Secret = null;

      phase = "p1_set";
      currentPlayer = 1;

      p1Attempts = 0;
      p2Attempts = 0;

      p1WrongGuesses.clear();
      p2WrongGuesses.clear();

      p1Solved = false;
      p2Solved = false;

      message = "Player 1";
      subMessage = "Secretly choose your number";
      footerMessage = "Player 2, look away 👀";

      input.value = "";
      input.type = "password";
      input.placeholder = "1 - 150";
      mainButton.textContent = "Lock P1 Number";

      particles = [];
      updateInputAvailability();
    }

    function handleResetAction() {
      if (onlineMode && !isHost) {
        if (conn && conn.open) {
          conn.send({ type: "reset" });
        }
        return;
      }

      resetGame();
      broadcastState();
    }

    function handleAction(forcedValue = null, fromRemote = false) {
      if (onlineMode && !isHost && !fromRemote) {
        if (!canLocalUserAct()) {
          setOnlineStatus(`Room ${roomCode}: wait for your turn.`);
          return;
        }

        const localValue = Number(input.value);
        if (!localValue || localValue < 1 || localValue > 150) {
          message = "Invalid Number";
          subMessage = "Enter a number from 1 to 150";
          footerMessage = "Try again";
          shakeScreen();
          return;
        }

        if (conn && conn.open) {
          conn.send({ type: "action", value: localValue });
          input.value = "";
        } else {
          setOnlineStatus(`Room ${roomCode}: not connected. Rejoin as P2.`);
        }
        return;
      }

      const actor = fromRemote ? 2 : myPlayer;
      if (onlineMode && isHost && !canPlayerAct(actor) && phase !== "game_over") {
        return;
      }

      const value = forcedValue !== null ? Number(forcedValue) : Number(input.value);

      if (phase === "game_over") {
        resetGame();
        broadcastState();
        return;
      }

      if (!value || value < 1 || value > 150) {
        message = "Invalid Number";
        subMessage = "Enter a number from 1 to 150";
        footerMessage = "Try again";
        shakeScreen();
        // Don't broadcast invalid-number state to other player
        updateInputAvailability();
        return;
      }

      if (phase === "p1_set") {
        p1Secret = value;

        phase = "p2_set";
        message = "Player 2";
        subMessage = "Secretly choose your number";
        footerMessage = "Player 1, look away 👀";

        input.value = "";
        input.type = "password";
        mainButton.textContent = "Lock P2 Number";

        spawnParticles("#00e5ff");
        broadcastState();
        return;
      }

      if (phase === "p2_set") {
        p2Secret = value;

        phase = "guessing";
        currentPlayer = 1;

        message = "Player 1 Guess";
        subMessage = "Guess Player 2's secret number";
        footerMessage = "Player 1 goes first";

        input.value = "";
        input.type = "number";
        input.min = "1";
        input.max = "150";
        input.placeholder = "Your guess";
        mainButton.textContent = "Guess";

        burstParticles(["#ff007a", "#00e5ff"]);
        broadcastState();
        return;
      }

      if (phase === "guessing") {
        makeGuess(value);
      }
    }

    function makeGuess(guess) {
      if (currentPlayer === 1 && p1Solved) {
        currentPlayer = 2;
      }

      if (currentPlayer === 2 && p2Solved) {
        currentPlayer = 1;
      }

      if (currentPlayer === 1) {
        p1Attempts++;

        if (guess === p2Secret) {
          p1Solved = true;
          message = "Player 1 Correct!";
          subMessage = `Player 2's number was ${p2Secret}`;
          footerMessage = `Player 1 solved it in ${p1Attempts} guesses`;
          burstParticles(["#ff007a", "#ffe600", "#00ff88"]);
        } else if (guess < p2Secret) {
          p1WrongGuesses.add(guess);
          message = "Too Low";
          subMessage = "Player 1, guess higher";
          footerMessage = `P1 attempts: ${p1Attempts}`;
          spawnParticles("#00e5ff");
        } else {
          p1WrongGuesses.add(guess);
          message = "Too High";
          subMessage = "Player 1, guess lower";
          footerMessage = `P1 attempts: ${p1Attempts}`;
          spawnParticles("#ff4fd8");
        }

        input.value = "";

        if (!p2Solved) {
          currentPlayer = 2;
          setTimeout(() => {
            if (!p1Solved || !p2Solved) {
              message = "Player 2 Guess";
              subMessage = "Guess Player 1's secret number";
              footerMessage = "Player 2's turn";
              broadcastState();
            }
          }, 900);
        }

        checkWinner();
        broadcastState();
        return;
      }

      if (currentPlayer === 2) {
        p2Attempts++;

        if (guess === p1Secret) {
          p2Solved = true;
          message = "Player 2 Correct!";
          subMessage = `Player 1's number was ${p1Secret}`;
          footerMessage = `Player 2 solved it in ${p2Attempts} guesses`;
          burstParticles(["#00e5ff", "#ffe600", "#00ff88"]);
        } else if (guess < p1Secret) {
          p2WrongGuesses.add(guess);
          message = "Too Low";
          subMessage = "Player 2, guess higher";
          footerMessage = `P2 attempts: ${p2Attempts}`;
          spawnParticles("#00e5ff");
        } else {
          p2WrongGuesses.add(guess);
          message = "Too High";
          subMessage = "Player 2, guess lower";
          footerMessage = `P2 attempts: ${p2Attempts}`;
          spawnParticles("#ff4fd8");
        }

        input.value = "";

        if (!p1Solved) {
          currentPlayer = 1;
          setTimeout(() => {
            if (!p1Solved || !p2Solved) {
              message = "Player 1 Guess";
              subMessage = "Guess Player 2's secret number";
              footerMessage = "Player 1's turn";
              broadcastState();
            }
          }, 900);
        }

        checkWinner();
        broadcastState();
      }
    }

    function checkWinner() {
      if (p1Solved && p2Solved) {
        phase = "game_over";
        input.value = "";
        input.type = "number";
        mainButton.textContent = "Play Again";

        if (p1Attempts < p2Attempts) {
          p1Wins++;
          message = "Player 1 Wins!";
          subMessage = `P1: ${p1Attempts} guesses | P2: ${p2Attempts} guesses`;
          footerMessage = "Fewer guesses wins";
        } else if (p2Attempts < p1Attempts) {
          p2Wins++;
          message = "Player 2 Wins!";
          subMessage = `P1: ${p1Attempts} guesses | P2: ${p2Attempts} guesses`;
          footerMessage = "Fewer guesses wins";
        } else {
          ties++;
          message = "It's A Tie!";
          subMessage = `Both solved it in ${p1Attempts} guesses`;
          footerMessage = "Rematch?";
        }

        burstParticles(["#ff007a", "#00e5ff", "#ffe600", "#00ff88", "#ffffff"]);
      }
    }

    function spawnParticles(color) {
      for (let i = 0; i < 22; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          r: Math.random() * 5 + 2,
          color: color,
          life: 45
        });
      }
    }

    function burstParticles(colors) {
      for (let i = 0; i < 110; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          r: Math.random() * 6 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 80
        });
      }
    }

    function shakeScreen() {
      shake = 12;
    }

    function drawBackground(offsetX, offsetY) {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#240046");
      gradient.addColorStop(0.5, "#10002b");
      gradient.addColorStop(1, "#030014");

      ctx.fillStyle = gradient;
      ctx.fillRect(offsetX, offsetY, canvas.width, canvas.height);

      for (let i = 0; i < 30; i++) {
        const x = (i * 53 + pulse * 1.7) % canvas.width;
        const y = (i * 79 + pulse * 1.2) % canvas.height;

        ctx.fillStyle = "rgba(255,255,255,0.07)";
        ctx.beginPath();
        ctx.arc(x + offsetX, y + offsetY, 2 + Math.sin(pulse / 12 + i) * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 2;

      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc(
          canvas.width / 2 + offsetX,
          canvas.height / 2 + offsetY,
          70 + i * 25 + Math.sin(pulse / 20) * 5,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }
    }

    function drawParticles(offsetX, offsetY) {
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 80);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x + offsetX, p.y + offsetY, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (p.life <= 0) {
          particles.splice(index, 1);
        }
      });
    }

    function drawText(offsetX, offsetY) {
      ctx.textAlign = "center";

      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "bold 15px Arial";
      ctx.fillText("SECRET NUMBER BATTLE", canvas.width / 2 + offsetX, 34 + offsetY);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 34px Arial";
      ctx.shadowColor = "#ff4fd8";
      ctx.shadowBlur = 20;
      ctx.fillText(message, canvas.width / 2 + offsetX, 82 + offsetY);

      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = "17px Arial";
      ctx.fillText(subMessage, canvas.width / 2 + offsetX, 116 + offsetY);

      ctx.fillStyle = "#ffe600";
      ctx.font = "bold 22px Arial";
      ctx.fillText("Range: 1 - 150", canvas.width / 2 + offsetX, 148 + offsetY);

      ctx.fillStyle = "#00ff88";
      ctx.font = "bold 17px Arial";
      ctx.fillText(`P1 Guesses: ${p1Attempts}`, canvas.width / 2 + offsetX, 176 + offsetY);

      ctx.fillStyle = "#00e5ff";
      ctx.font = "bold 17px Arial";
      ctx.fillText(`P2 Guesses: ${p2Attempts}`, canvas.width / 2 + offsetX, 198 + offsetY);

      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "bold 15px Arial";
      ctx.fillText(`Wins  P1: ${p1Wins}  |  P2: ${p2Wins}  |  Ties: ${ties}`, canvas.width / 2 + offsetX, 218 + offsetY);

      const boardOwner = currentPlayer === 1 ? "P1" : "P2";
      ctx.fillStyle = "rgba(255,255,255,0.72)";
      ctx.font = "14px Arial";
      ctx.fillText(`${boardOwner} Guess Board (grey = wrong)`, canvas.width / 2 + offsetX, 236 + offsetY);

      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.font = "15px Arial";
      ctx.fillText(footerMessage, canvas.width / 2 + offsetX, 500 + offsetY);
    }

    function drawNumberGrid(offsetX, offsetY) {
      const gridX = 22 + offsetX;
      const gridY = 246 + offsetY;
      const cols = 15;
      const rows = 10;
      const cellW = 27;
      const cellH = 22;
      const activeWrongGuesses = currentPlayer === 1 ? p1WrongGuesses : p2WrongGuesses;

      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(gridX - 8, gridY - 12, cols * cellW + 16, rows * cellH + 16);

      for (let n = 1; n <= 150; n++) {
        const idx = n - 1;
        const col = idx % cols;
        const row = Math.floor(idx / cols);

        const x = gridX + col * cellW + cellW / 2;
        const y = gridY + row * cellH + 15;

        if (activeWrongGuesses.has(n)) {
          ctx.fillStyle = "rgba(165,165,165,0.82)";
        } else {
          ctx.fillStyle = "rgba(255,255,255,0.95)";
        }

        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(String(n), x, y);
      }
    }

    function draw() {
      pulse++;

      let offsetX = 0;
      let offsetY = 0;

      if (shake > 0) {
        offsetX = (Math.random() - 0.5) * shake;
        offsetY = (Math.random() - 0.5) * shake;
        shake *= 0.85;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground(offsetX, offsetY);
      drawParticles(offsetX, offsetY);
      drawText(offsetX, offsetY);
      drawNumberGrid(offsetX, offsetY);

      requestAnimationFrame(draw);
    }

    const initialRoomCode = sanitizeRoomCode(new URLSearchParams(window.location.search).get("room")) || DEFAULT_ROOM_CODE;
    roomCodeInput.value = initialRoomCode;
    setOnlineStatus(`Room ${initialRoomCode} ready. Player 1 taps Host As P1, Player 2 taps Join As P2.`);

    resizeCanvas();
    resetGame();
    draw();
  </script>
</body>
</html>
